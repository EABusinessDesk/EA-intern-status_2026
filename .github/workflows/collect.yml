name: Collect intern commit digest

on:
  schedule:
    - cron: '10 15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-digest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect digest from project repos
        env:
          GH_TOKEN: ${{ secrets.INTERN_REVIEW_TOKEN }}
        run: python scripts/collect.py

      - name: Commit digest
        run: |
          git config user.name  "intern-status-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "digest $(date -u +%F)"
            git push
          fi
